[project]
name = "projectforge"
version = "0.1.0"
description = "AI-powered CLI tool for college project blueprints"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "google-genai>=0.2.2"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "pytest-mock>=3.12",
    "ruff>=0.3.0"
]

[project.scripts]
projectforge = "projectforge.__main__:main"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
addopts = "--cov=src/projectforge --cov-report=term-missing"
testpaths = ["tests"]
